<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem maximum-scale: bloquear o zoom prejudica a acessibilidade. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A120A" />
    <!-- Tema escolhido (claro/escuro): aplicado antes da primeira pintura, para a página não piscar no
         escuro. A chave e as cores espelham src/lib/tema.ts. -->
    <script>
      try {
        if (sessionStorage.getItem('crai:tema') === 'claro') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#FAF6EF'
        }
      } catch (e) {}
    </script>

    <!-- Padrões da home. O App troca título, descrição, canonical e robots a cada rota (src/lib/seo.ts).
         %SITE_URL% vem de VITE_SITE_URL no build (vite.config.ts). -->
    <title>CRAI — Recuperação de receita e retenção para SaaS</title>
    <meta name="description" content="A CRAI recupera cobranças falhas por Pix Automático e ajuda a reter assinantes de SaaS brasileiros. Você só paga sobre a receita que volta." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph / prévia no WhatsApp, LinkedIn e Slack (esses robôs não executam JS: valem estes valores). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CRAI" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="CRAI — Recuperação de receita e retenção para SaaS" />
    <meta property="og:description" content="A CRAI recupera cobranças falhas por Pix Automático e ajuda a reter assinantes de SaaS brasileiros. Você só paga sobre a receita que volta." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CRAI — Recuperação de receita e retenção para SaaS. Pix Automático, IA, LGPD." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Ícones -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
